<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a66;
    --line: #dddbd5;
    --accent: #1f5f8b;
    --accent-ink: #ffffff;
    --accent-soft: #e6eef4;
    --warn: #9a5b00;
    --warn-soft: #fbf0dc;
    --danger: #a32d2d;
    --danger-soft: #f8e4e2;
    --ok: #2f6b3a;
    --ok-soft: #e3f0e5;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171716;
      --surface: #22211f;
      --text: #ecebe7;
      --muted: #a3a19b;
      --line: #3a3936;
      --accent: #7fb3d9;
      --accent-ink: #10202c;
      --accent-soft: #23323d;
      --warn: #e2b05c;
      --warn-soft: #3a2f1c;
      --danger: #e98a82;
      --danger-soft: #3d2423;
      --ok: #8fc79a;
      --ok-soft: #1f3324;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 'IBM Plex Sans Thai', 'Segoe UI', system-ui, sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; line-height: 1.25; }
  h2 { font-size: 18px; font-weight: 700; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- layout: left menu + page ---------- */
  .shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 100vh; }
  .side {
    background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px;
    display: flex; flex-direction: column; gap: 12px; position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; flex-direction: column; padding: 0 8px; }
  .brand b { font-size: 18px; }
  .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
  .nav button {
    display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: none;
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--text);
  }
  .nav button:hover { background: var(--bg); }
  .nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .nav-count {
    margin-left: auto; font-size: 12px; min-width: 20px; text-align: center; border-radius: 999px; padding: 0 6px;
    background: var(--danger-soft); color: var(--danger);
  }
  .nav-group { margin: 22px 10px 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .me { border-top: 1px solid var(--line); padding: 10px 8px 0; display: grid; gap: 4px; }
  .link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font: inherit; text-align: left; }
  .main { padding: 16px 20px 48px; max-width: 1180px; width: 100%; margin: 0 auto; }
  .topline { margin-bottom: 12px; }
  .page-title { font-size: 22px; }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; gap: 8px; }
    .nav { flex-direction: row; overflow-x: auto; flex: none; }
    .nav button { white-space: nowrap; }
    .nav-group { display: none; }
    .me { border-top: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
    .main { padding: 12px 16px 40px; }
  }

  /* ---------- login ---------- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login-card { width: 100%; max-width: 360px; display: grid; gap: 12px; }
  .login-card > * + * { margin-top: 0; }
  .login-card h1 { font-size: 22px; }
  .login-msg { color: var(--danger); min-height: 1.2em; font-size: 14px; }
  .login-hint { color: var(--danger); font-size: 14px; font-weight: 600; }
  .field { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
  .field input, .field select { font-weight: 400; width: 100%; }
  .field.grow { flex: 1 1 280px; }
  /* ใบเบิกพิเศษ: one line per medicine, added from a search box with suggestions */
  .ex-add { position: relative; display: grid; gap: 4px; margin: 12px 0; max-width: 520px; }
  .ex-add input { width: 100%; }
  .suggest { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; list-style: none; margin: 2px 0 0; padding: 4px 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
    max-height: 320px; overflow-y: auto; }
  .suggest li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px; cursor: pointer; }
  .suggest li.active, .suggest li[data-exadd]:hover { background: var(--accent-soft); }
  .suggest li.none { cursor: default; }
  table.ex-lines tr.need input { border-color: var(--danger); background: var(--danger-soft); }
  .field input[readonly] { background: var(--bg); color: var(--muted); }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 16px;
  }
  .card > * + * { margin-top: 12px; }
  .stack > * + * { margin-top: 12px; }
  .nowrap { white-space: nowrap; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spacer { flex: 1; }

  /* ---------- controls ---------- */
  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
    padding: 7px 14px; cursor: pointer; font-weight: 600;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.small { padding: 3px 10px; font-size: 13px; }
  /* icons (Streamline Guidance, 1px on 24x24: thickened to read at 18px) */
  .ic { width: 18px; height: 18px; flex: none; vertical-align: -4px; margin-right: 6px; }
  .ic path, .ic g { stroke-width: 1.6; }
  .btn.small .ic { width: 15px; height: 15px; vertical-align: -3px; margin-right: 4px; }
  .nav .ic { width: 20px; height: 20px; margin-right: 0; opacity: .85; }
  .nav button[aria-current="page"] .ic { opacity: 1; }
  .link .ic { width: 15px; height: 15px; vertical-align: -3px; margin-right: 3px; }
  @media print { .ic { display: none; } }
  input[type=number], input[type=text], input[type=search], input[type=password], input[type=date], select {
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--surface);
    min-width: 0;
  }
  input:focus, select:focus, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=number] { width: 100%; text-align: right; }
  input:disabled { background: transparent; border-color: transparent; }
  label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

  .badge {
    display: inline-block; font-size: 12px; font-weight: 600; padding: 0 6px; border-radius: 4px;
    background: var(--accent-soft); color: var(--accent); white-space: nowrap;
  }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.danger { background: var(--danger-soft); color: var(--danger); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }

  .notice { padding: 10px 12px; border-radius: 6px; background: var(--accent-soft); }
  .data-info { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; padding: 8px 12px; border-radius: 6px; background: var(--accent-soft); }
  .data-info .ic { width: 20px; height: 20px; flex: none; margin-top: 2px; }
  .notice.error { background: var(--danger-soft); color: var(--danger); }
  .notice.ok { background: var(--ok-soft); color: var(--ok); }
  .notice ul { margin: 6px 0 0; padding-left: 20px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .stat { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }

  /* ---------- import ---------- */
  .drop {
    display: block; border: 2px dashed var(--line); border-radius: var(--radius);
    padding: 32px 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop-main { font-size: 17px; font-weight: 700; }
  table.plain { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.plain th, table.plain td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; }
  .table-wrap { overflow-x: auto; }

  /* ---------- count list ---------- */
  .toolbar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); }
  .loc-head { margin: 16px 0 4px; font-weight: 700; color: var(--muted); font-size: 14px; }
  .drow {
    display: grid; grid-template-columns: minmax(0, 1fr) 72px 92px 64px 92px 64px 80px; gap: 8px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 4px;
  }
  .drow.head { background: none; border: 0; padding: 0 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .drow.has-order { border-left: 3px solid var(--accent); }
  .drow.below-min { border-left: 3px solid var(--danger); background: var(--danger-soft); }
  .drow .mm b { font-weight: 600; }
  .drow .name { font-weight: 600; overflow-wrap: anywhere; }
  .drow .meta { font-size: 12px; color: var(--muted); }
  .drow .flags { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
  .drow .flags:empty { display: none; }
  .drow .reason { grid-column: 1 / -1; }
  .drow .reason input { width: 100%; }
  .drow .lbl { display: none; font-size: 11px; color: var(--muted); }
  @media (max-width: 640px) {
    .drow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .drow .cell-name { grid-column: 1 / -1; }
    .drow.head { display: none; }
    .drow .lbl { display: block; }
  }
  .save-state { font-size: 13px; }

  /* ---------- printable form ---------- */
  .paper-wrap { overflow-x: auto; }
  .form-page {
    width: 190mm; min-height: 270mm; margin: 0 auto 16px; padding: 6mm 4mm; background: #fff; color: #000;
    font-size: 12.5px; line-height: 1.3; box-shadow: 0 0 0 1px var(--line);
  }
  .form-page table { width: 100%; border-collapse: collapse; }
  .form-page td, .form-page th { border: 1px solid #000; padding: 2px 4px; vertical-align: top; }
  .fp-title { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; margin-bottom: 4px; }
  .fp-title h1 { font-size: 20px; text-align: center; }
  .fp-title .r { text-align: right; }
  .fp-lines th { font-weight: 600; text-align: center; vertical-align: middle; font-size: 11.5px; }
  .fp-lines td { height: 8.4mm; vertical-align: middle; }
  .fp-lines td.c { text-align: center; }
  .fp-lines td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .fp-head td { height: 9mm; }
  .fp-foot td { height: 11mm; }
  .fill { display: inline-block; min-width: 30mm; border-bottom: 1px dotted #000; }
  .opd-page { width: 190mm; margin: 0 auto 16px; padding: 8mm 6mm; background: #fff; color: #000; box-shadow: 0 0 0 1px var(--line); }
  .opd-page h1 { font-size: 18px; text-align: center; margin-bottom: 4px; }
  .opd-page table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  .opd-page td, .opd-page th { border: 1px solid #000; padding: 4px 6px; }
  .sign { display: flex; justify-content: space-around; margin-top: 24px; }
  .opd-req + .opd-req { border-top: 1px solid var(--line); padding-top: 12px; }
  .opd-req > * + * { margin-top: 8px; }

  /* min/max shelf list: one row per drug, cut into strips or kept as a sheet */
  .mm-page { width: 190mm; margin: 0 auto 16px; padding: 8mm 6mm; background: #fff; color: #000; box-shadow: 0 0 0 1px var(--line); }
  .mm-page h1 { font-size: 18px; text-align: center; margin-bottom: 2px; }
  .mm-page h2 { font-size: 15px; margin: 10px 0 4px; break-after: avoid; }
  .mm-page table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .mm-page td, .mm-page th { border: 1px solid #000; padding: 5px 6px; }
  .mm-page td.n { text-align: right; font-size: 16px; font-weight: 700; width: 16%; }
  .mm-page tr { break-inside: avoid; }

  /* count sheet: printed before counting */
  .cs-page { width: 190mm; margin: 0 auto; padding: 6mm; background: #fff; color: #000; }
  .cs-page h1 { font-size: 18px; text-align: center; margin-bottom: 4px; }
  .cs-page h2 { font-size: 15px; margin: 10px 0 4px; break-after: avoid; }
  .cs-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .cs-page table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cs-page td, .cs-page th { border: 1px solid #000; padding: 4px 6px; }
  .cs-page td { height: 7.5mm; }
  .cs-page td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .cs-page td.c { text-align: center; }
  .cs-page tr { break-inside: avoid; }
  /* every other row light grey, so staff keep their place across the row; printed even when
     the print dialog's "Background graphics" is off */
  .cs-page tr.alt td, .mm-page tr.alt td { background: #e9e9e9; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .cs-page thead { display: table-header-group; }

  /* ---------- home ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile {
    text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; cursor: pointer; display: grid; gap: 2px;
  }
  .tile:hover { border-color: var(--accent); }
  .tile b { font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tile span { color: var(--muted); font-size: 14px; }
  .tile.danger b { color: var(--danger); }
  .tile.warn b { color: var(--warn); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; counter-reset: step; }
  /* each step is a button: done = green ✓, the next one = accent border + ถัดไป */
  .steps li { display: flex; }
  .steps .step {
    flex: 1; font: inherit; color: inherit; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
    transition: border-color .12s, box-shadow .12s, background .12s;
  }
  .steps .step:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
  .steps .step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .steps .step-no { font-size: 12px; color: var(--muted); }
  .steps li.done .step { border-color: var(--ok); background: var(--ok-soft); }
  .steps li.done .step-no { color: var(--ok); font-weight: 600; }
  .steps li.next .step { border: 2px solid var(--accent); background: var(--accent-soft); padding: 7px 9px; }
  .steps li.next .step-no { color: var(--accent); font-weight: 700; }
  .step-name { font-weight: 600; }
  .step-name .ic { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }

  /* ---------- medicines + stock card ---------- */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
  .split .card { margin-bottom: 0; }
  #drug-card { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
  @media (max-width: 900px) {
    .split { grid-template-columns: 1fr; }
    #drug-card { position: static; max-height: none; }
  }
  #drug-q, #log-q { width: 100%; }
  .chips { gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 12px;
    cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip[aria-pressed="true"] .muted { color: inherit; opacity: .8; }
  table.list td { padding: 6px; vertical-align: top; }
  #receive-body table { width: 100%; }
  table.list .name { font-weight: 600; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--bg); }
  tr.click.sel td { background: var(--accent-soft); }
  tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .kv > div { background: var(--bg); border-radius: 6px; padding: 8px 10px; display: grid; gap: 1px; }
  .kv b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .stock-card h3 { font-size: 15px; }
  .lots { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .lots li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding: 4px 0; }
  .lots li .btn { margin-left: auto; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 12px; margin: 0; }
  fieldset > * + * { margin-top: 8px; }
  legend { font-weight: 700; padding: 0 4px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }

  /* ---------- requests ---------- */
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 16px; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 8px 16px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg.sub { margin-bottom: 12px; display: flex; width: fit-content; }
  .seg.sub button { padding: 6px 14px; }
  .drow.opd { grid-template-columns: minmax(0, 1fr) 110px 92px; }
  @media (max-width: 640px) { .drow.opd { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* ---------- delivery checks: expiry dates ---------- */
  table.recv td { vertical-align: middle; }
  td.exp { min-width: 190px; }
  .exp-in { display: inline-flex; align-items: center; gap: 2px; margin: 0 6px 4px 0; }
  .exp-in input { width: 150px; }
  td.exp.need input[type=date] { border-color: var(--danger); background: var(--danger-soft); }
  .danger-text { color: var(--danger); font-weight: 600; }
  /* expiry within 3 months (or already expired) at the delivery check */
  .exp-in { flex-wrap: wrap; }
  .exp-in.soon input[type=date] { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); font-weight: 600; }
  .exp-warn { color: var(--danger); font-size: 12px; font-weight: 600; flex-basis: 100%; }
  .exp-warn:empty { display: none; }
  .x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; }
  .x:hover { color: var(--danger); }

  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 16px; width: min(380px, calc(100% - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .35); }

  /* credit (program-credit): footer on every screen, About dialog, line on printouts */
  .pl-credit { font-size: 12px; color: var(--muted); text-align: center; padding: 12px 16px; border-top: 1px solid var(--line); margin-top: 24px; }
  .login .pl-credit { border-top: 0; margin-top: 8px; padding-top: 0; }
  .login { grid-template-rows: 1fr auto; }
  .pl-credit button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  dialog.pl-about { width: min(440px, calc(100% - 32px)); line-height: 1.6; }
  .pl-about h2 { margin: 0 0 4px; font-size: 18px; }
  .pl-about p { margin: 8px 0; font-size: 14px; }
  .pl-about .pl-small { font-size: 12px; opacity: .75; }
  .pl-about form { text-align: right; margin-top: 12px; }
  .pl-print-credit { font-size: 10px; text-align: center; margin-top: 6px; color: #444; }

  .toast {
