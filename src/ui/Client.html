        '<li>ยาใหม่ ' + r.newDrugs.length + ' รายการ · ปรับราคา ' + r.priceUpdates + ' รายการ</li>' +
        '<li>เบิกจากคลัง ' + (rc.source.MAIN || 0) + ' · ขอจาก OPD ' + (rc.source.OPD || 0) +
        ' · ต้องนับ ' + rc.stocked + ' รายการ</li>' +
        (rc.expensive && rc.expensive.length ? '<li>ยาราคาสูงใช้ไม่บ่อย ' + rc.expensive.length + ' รายการ: ตอนนี้ให้ขอจาก OPD ถ้าจะสต็อก ให้เภสัชกำหนดยอดสูงสุดเองที่ รายการยา › แก้ไขข้อมูลยา</li>' : '') +
        '</ul></div>';
      return reload();
    }).catch(function (e) {
      $('import-result').innerHTML = '<div class="notice error">นำเข้าไม่สำเร็จ: ' + esc(errMsg(e)) + '</div>';
      $('btn-import').disabled = false;
    });

    if (u) {
      html += '<form class="card stack" id="user-form"><h2>' + (isNew ? 'เพิ่มผู้ใช้' : 'แก้ไขผู้ใช้ ' + esc(u.username)) + '</h2><div class="grid3">' +
        (isNew ? '<label class="field">ชื่อผู้ใช้ (ใช้เข้าสู่ระบบ)<input id="uf-username" autocapitalize="none" required></label>' : '') +
        '<label class="field">ชื่อที่แสดง<input id="uf-name" value="' + esc(u.name || '') + '" required></label>' +
        '<label class="field">สิทธิ์<select id="uf-role"><option value="staff"' + (u.role !== 'admin' ? ' selected' : '') + '>เจ้าหน้าที่</option>' +
        '<option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>ผู้ดูแลระบบ</option></select></label>' +
        '<label class="field">' + (isNew ? 'รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)' : 'ตั้งรหัสผ่านใหม่ (ว่าง = ใช้รหัสเดิม)') +
        '<input id="uf-pw" type="text" autocomplete="off"' + (isNew ? ' required minlength="6"' : '') + '></label></div>' +
        '<label class="check"><input type="checkbox" id="uf-active"' + (u.active !== false ? ' checked' : '') + '> ใช้งานได้</label>' +
        '<div class="row"><button class="btn primary" type="submit" id="uf-save">บันทึก</button><button class="btn" type="button" id="uf-cancel">ยกเลิก</button></div></form>';
    }
    $('users-body').innerHTML = html;
    $('btn-new-user').onclick = function () { S.editUser = { username: '', name: '', role: 'staff', active: true }; renderUsers(); $('uf-username').focus(); };
    each('[data-edituser]', $('users-body'), function (b) {
      b.onclick = function () {
        var x = S.users.filter(function (y) { return y.username === b.getAttribute('data-edituser'); })[0];
        S.editUser = JSON.parse(JSON.stringify(x)); renderUsers(); $('uf-name').focus();
      };
    });
    if (u) {
      $('uf-cancel').onclick = function () { S.editUser = null; renderUsers(); };
      $('user-form').onsubmit = function (e) {
        e.preventDefault();
        var out = { username: isNew ? $('uf-username').value : u.username, name: $('uf-name').value, role: $('uf-role').value,
          active: $('uf-active').checked, password: $('uf-pw').value };
        $('uf-save').disabled = true;
        api('apiSaveUser', out).then(function (list) {
          S.users = list; S.editUser = null; renderUsers();
          toast('บันทึกแล้ว' + (out.password ? ' แจ้งรหัสผ่านให้เจ้าตัว และให้เปลี่ยนรหัสเองหลังเข้าสู่ระบบ' : ''));
        }).catch(function (err) { $('uf-save').disabled = false; toast('บันทึกไม่สำเร็จ: ' + errMsg(err), true); });
      };
    }
  }

  // ------------------------------------------------------- admin: change log
  function loadLog() {
    $('log-table').innerHTML = '<p><span class="spinner"></span> กำลังโหลด…</p>';
    api('apiChangeLog', 500).then(function (rows) { S.log = rows; renderLog(); })
      .catch(function (e) { toast('โหลดประวัติไม่สำเร็จ: ' + errMsg(e), true); });
  }
  function renderLog() {
    if (!S.log) return;
    var q = S.logQ.trim().toLowerCase();
    var rows = S.log.filter(function (r) { return !q || (r.user + ' ' + r.action + ' ' + r.target + ' ' + r.detail).toLowerCase().indexOf(q) >= 0; });
    $('log-table').innerHTML = rows.length ? '<table class="plain"><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายการ</th><th>รายละเอียด</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td class="nowrap">' + esc(thDateTime(r.at)) + '</td><td>' + esc(r.user) + '</td><td>' + esc(r.action) + '</td><td>' + esc(r.target) +
          '</td><td class="small">' + esc(r.detail) + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p class="muted">ไม่มีรายการ</p>';
  }

  // --------------------------------------------------------- change password
  function openPw() {
    ['pw-old', 'pw-new', 'pw-new2'].forEach(function (id) { $(id).value = ''; });
    $('pw-msg').textContent = '';
    var dlg = $('dlg-pw');
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    $('pw-old').focus();
  }
  function closePw() { var dlg = $('dlg-pw'); if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
  function savePw(e) {
    e.preventDefault();
    if ($('pw-new').value !== $('pw-new2').value) { $('pw-msg').textContent = 'รหัสผ่านใหม่สองช่องไม่ตรงกัน'; return; }
    $('btn-pw-save').disabled = true;
    api('apiChangePassword', $('pw-old').value, $('pw-new').value).then(function () {
      $('btn-pw-save').disabled = false;
      closePw();
      toast('เปลี่ยนรหัสผ่านแล้ว');
    }).catch(function (err) { $('btn-pw-save').disabled = false; $('pw-msg').textContent = errMsg(err); });
  }

  // ------------------------------------------------------------------ wiring
  function wire() {
    $('login-form').onsubmit = doLogin;
    $('btn-logout').onclick = logout;
    $('btn-pw').onclick = openPw;
    $('pw-form').onsubmit = savePw;
    $('btn-pw-cancel').onclick = closePw;

    $('nav').onclick = function (e) {
      var b = e.target.closest('[data-view]');
      if (b) showView(b.getAttribute('data-view'));
    };

    // medicines
    $('drug-q').oninput = function () { S.drugQ = this.value; renderDrugTable(); };
    $('drug-chips').onclick = function (e) {
      var b = e.target.closest('[data-f]');
      if (!b) return;
      S.drugF = b.getAttribute('data-f');
      renderDrugs();
    };
    $('drug-table').onclick = function (e) {
      var tr = e.target.closest('tr[data-id]');
      if (tr) openDrug(tr.getAttribute('data-id'));
    };
    $('drug-table').onkeydown = function (e) {
      var tr = e.target.closest('tr[data-id]');
      if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrug(tr.getAttribute('data-id')); }
    };
    $('btn-add-drug').onclick = function () {
      S.drugSel = null; S.card = null;
      S.editing = { drug_id: '', hosxp_name: '', strength: '', unit: '', request_name: '', request_unit: '', request_factor: '',
        item_code: '', pack_size: '', source: '', critical: false, max: '', min: '' };
      renderDrugTable(); renderCard();
    };

    // requests
    each('#view-request > .seg [data-mode]', null, function (b) {
      b.onclick = function () { flushSave(); S.reqMode = b.getAttribute('data-mode'); store('reqMode', S.reqMode); renderRequest(); };
    });
    each('#req-main .seg [data-sub]', null, function (b) {
      b.onclick = function () { flushSave(); S.reqSub = b.getAttribute('data-sub'); renderRequest(); };
    });
    ['book', 'no', 'from', 'to', 'date'].forEach(function (k) {
      $('fh-' + k).oninput = function () { S.head[k] = this.value; store('head', { book: S.head.book, from: S.head.from, to: S.head.to }); renderForm(); };
    });
    $('btn-print-form').onclick = function () {
      flushSave().then(function () { renderForm(); printHtml($('form-pages').innerHTML); markPrinted('form'); });
    };
    $('btn-csv-form').onclick = function () {
      download('ใบเบิก-IPD-' + (S.state.round ? S.state.round.count_date : S.state.today) + '.csv', toCsv(formRows()));
    };
    $('btn-copy-form').onclick = function () {
      copyText(formRows().map(function (r) { return r.join('\t'); }).join('\n'));
    };
    $('opd-search').oninput = function () { S.opdFilter = this.value; renderOpd(); };
    $('btn-opd-clear').onclick = function () { S.opdSel = {}; S.opdQty = {}; store('opdSel', {}); store('opdQty', {}); renderOpd(); };
    $('opd-all').onchange = function () {
      S.opdAll = this.checked;
      $('opd-kind').value = this.checked ? 'URGENT' : 'MONTHLY';
      renderOpd();
    };
    $('btn-save-opd').onclick = saveOpdRequest;
    $('ex-search').oninput = function () { S.exFilter = this.value; renderExtra(); };
    $('btn-ex-clear').onclick = function () { S.exQty = {}; store('exQty', {}); renderExtra(); };
    $('btn-save-ex').onclick = saveExtra;
    $('btn-copy-opd').onclick = function () {
      var rows = [['ลำดับ', 'รายการ', 'จำนวน', 'หน่วย', 'หมายเหตุ']].concat(opdLines().map(function (x, i) {
        return [i + 1, drugLabel(x.d), x.qty, x.d.unit, 'IPD'];
      }));
      copyText(rows.map(function (r) { return r.join('\t'); }).join('\n'));
    };

    // import
    var drop = $('drop'), file = $('file');
    file.onchange = function () { handleFile(file.files[0]); };
    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) { handleFile(e.dataTransfer.files[0]); });
    // Dropping a file outside the box must not navigate away from the app.
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) { e.preventDefault(); });

    // min/max
    $('btn-print-mm').onclick = function () { renderMinMax(); printHtml($('mm-print').innerHTML); };
    $('btn-csv-mm').onclick = function () { download('min-max-IPD-' + S.state.today + '.csv', toCsv(mmRows())); };

    // change log
    $('log-q').oninput = function () { S.logQ = this.value; renderLog(); };
    $('btn-log-refresh').onclick = loadLog;

    window.addEventListener('beforeunload', function (e) {
      var typed = Object.keys(S.recvQty).length || Object.keys(S.recvExp).length;
      if (Object.keys(S.pending).length) { flushSave(); e.preventDefault(); e.returnValue = ''; }
      else if (typed) { e.preventDefault(); e.returnValue = ''; }
    });
  }

  var savedHead = load('head', null);
  if (savedHead) { S.head.book = savedHead.book || ''; S.head.from = savedHead.from || S.head.from; S.head.to = savedHead.to || S.head.to; }
  S.opdSel = load('opdSel', {});
  S.opdQty = load('opdQty', {});
  S.reqMode = load('reqMode', 'main');
  if (['main', 'opd', 'extra'].indexOf(S.reqMode) < 0) S.reqMode = 'main';
  S.exQty = load('exQty', {});
  S.token = load('token', null);
  addIcons(document);
  each('.pl-about-open', null, function (b) {
    b.onclick = function () { var d = $('pl-about'); if (d.showModal) d.showModal(); else d.setAttribute('open', ''); };
  });
  wire();
  if (S.token) reload(); else showLogin('');
})();
</script>
